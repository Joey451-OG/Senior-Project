# Sandbox for the cron helper. It edits crontabs through the system's own `crontab` command, which
# switches ids, chowns files and (on some distros) is setuid/setgid and checks PAM or SELinux, so
# capabilities and NoNewPrivileges are left alone here. What's fenced off is the filesystem
# (writable: its socket directory and the cron spool, which holds every distro's crontabs:
# /var/spool/cron, /var/spool/cron/crontabs, /var/spool/cron/tabs) and the kernel.
[Service]
ProtectSystem=strict
ReadWritePaths=/run/waru-dashboard -/var/spool/cron
ProtectHome=read-only
PrivateTmp=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
RestrictNamespaces=yes
RestrictRealtime=yes
LockPersonality=yes
# Not just AF_UNIX: looking up a user name may go through NSS modules that use the network (LDAP).
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6 AF_NETLINK
SystemCallArchitectures=native

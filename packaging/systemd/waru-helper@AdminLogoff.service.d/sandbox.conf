# Sandbox for the log-off helper. It finds a user's processes in /proc and kills them with
# AdminProcesses' pidfd-based code, so it gets the same settings: as root it keeps just CAP_KILL
# (signal other users' processes) and CAP_CHOWN (hand its socket to the `waru` group).
[Service]
CapabilityBoundingSet=CAP_KILL CAP_CHOWN
NoNewPrivileges=yes
ProtectSystem=strict
ReadWritePaths=/run/waru-dashboard
ProtectHome=read-only
PrivateTmp=yes
PrivateDevices=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
RestrictNamespaces=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
LockPersonality=yes
# Not just AF_UNIX: looking up a user name may go through NSS modules that use the network (LDAP).
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6 AF_NETLINK
SystemCallArchitectures=native
SystemCallFilter=@system-service
SystemCallErrorNumber=EPERM

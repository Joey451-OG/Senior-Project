# The privileged helpers' socket directory. Only root and the `waru` group (the API's service
# account) may even enter it; the helpers make each socket 0660 root:waru inside it as well.
# A tmpfiles entry rather than RuntimeDirectory=, which would delete the shared directory whenever
# any one of the five units stopped. Installed to /etc/tmpfiles.d by install.sh.
d /run/waru-dashboard 0750 root waru -
